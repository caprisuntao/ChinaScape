$kind: http-request
description: Should return 404 for an attraction that does not exist
url: "{{baseUrl}}/api/attractions/99999"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 404', function () {
        pm.response.to.have.status(404);
      });
    language: text/javascript
order: 6000
